name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        run: |
          manifest_version=$(python -c "import json; print(json.load(open('custom_components/fluvalble/manifest.json'))['version'])")
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::manifest.json version ($manifest_version) does not match tag ($tag_version)"
            exit 1
          fi
          echo "Version check passed: $manifest_version"

      - name: Prepare curated release notes
        run: |
          notes_path="docs/releases/v${{ steps.version.outputs.version }}.md"
          if [ ! -f "$notes_path" ]; then
            echo "::error::Missing curated release notes: $notes_path"
            echo "::error::Add and review this file before creating the release tag."
            exit 1
          fi
          cp "$notes_path" /tmp/release_notes.md
          echo "Using curated release notes from $notes_path"

      - name: Package integration
        run: |
          zip -r fluvalble-${{ steps.version.outputs.version }}.zip \
            custom_components/fluvalble/ \
            --exclude "**/__pycache__/*" \
            --exclude "**/*.pyc"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body_path: /tmp/release_notes.md
          files: |
            fluvalble-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
