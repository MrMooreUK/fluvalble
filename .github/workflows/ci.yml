name: CI

on:
  push:
    # CI runs on the stable branch, the dev integration branch, and all
    # feature / review branches so problems are caught before merging.
    branches: [master, main, dev, "claude/**", "feature/**", "fix/**"]
  pull_request:
    # All PRs must pass CI regardless of their target branch.
    branches: [master, main, dev]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Lint
  # -----------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff

      - name: Run Ruff (linter + formatter check)
        run: |
          ruff check custom_components/ tests/

  # -----------------------------------------------------------------------
  # Validate manifest.json
  # -----------------------------------------------------------------------
  validate-manifest:
    name: Validate manifest.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check manifest.json is valid JSON
        run: python -c "import json; json.load(open('custom_components/fluvalble/manifest.json'))"

      - name: Check required manifest fields
        run: |
          python - <<'EOF'
          import json, sys
          manifest = json.load(open("custom_components/fluvalble/manifest.json"))
          required = ["domain", "name", "version", "codeowners", "documentation",
                      "issue_tracker", "iot_class", "requirements", "loggers"]
          missing = [f for f in required if f not in manifest]
          if missing:
              print(f"Missing manifest fields: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"manifest.json OK — version {manifest['version']}")
          EOF

  # -----------------------------------------------------------------------
  # Validate strings / translations
  # -----------------------------------------------------------------------
  validate-translations:
    name: Validate translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check strings.json is valid JSON
        run: python -c "import json; json.load(open('custom_components/fluvalble/strings.json'))"

      - name: Check translations/en.json is valid JSON
        run: python -c "import json; json.load(open('custom_components/fluvalble/translations/en.json'))"

      - name: Check en.json keys match strings.json top-level sections
        run: |
          python - <<'EOF'
          import json, sys
          strings = json.load(open("custom_components/fluvalble/strings.json"))
          en = json.load(open("custom_components/fluvalble/translations/en.json"))
          missing = set(strings.keys()) - set(en.keys())
          if missing:
              print(f"Sections in strings.json missing from en.json: {missing}", file=sys.stderr)
              sys.exit(1)
          print("Translation keys OK")
          EOF

  # -----------------------------------------------------------------------
  # Unit tests
  # -----------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # Static type checking (soft, non-gating)
  # -----------------------------------------------------------------------
  mypy:
    name: mypy (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        # HA's runtime types are not installable in CI; we type-check against
        # the integration's own modules only. This is a soft, non-gating pass:
        # existing type errors are reported in the job log so we can see
        # progress as the integration gains type hints, but they don't fail
        # the build. `|| true` makes the exit-code-0-on-failure explicit.
        # Tighten this gradually — see `pyproject.toml` `[tool.mypy]` and
        # `docs/bug-triage.md`.
        run: |
          mypy custom_components/fluvalble/ \
            --ignore-missing-imports \
            --no-implicit-optional \
            --warn-unused-ignores \
            --warn-redundant-casts \
            || true

  # -----------------------------------------------------------------------
  # Test coverage
  # -----------------------------------------------------------------------
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=custom_components/fluvalble \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        # Set the repository's CODECOV_TOKEN secret to enable uploads.
        # The job degrades gracefully if the token is missing.
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # -----------------------------------------------------------------------
  # HACS validation
  # -----------------------------------------------------------------------
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # Full HACS publication validation requires repository-level metadata
    # (topics, public listing state) that fork/PR CI cannot guarantee. Keep it
    # on stable branch pushes; PRs still validate manifest and hacs.json shape.
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  # -----------------------------------------------------------------------
  # Branch guard — prevent direct PRs to master/main
  # All changes must flow through dev first.
  # -----------------------------------------------------------------------
  branch-guard:
    name: Branch guard (PR targets dev, not master)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Enforce dev-first workflow
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"
          echo "PR: $SOURCE → $TARGET"

          # If a dev branch exists, require feature/fix PRs to target it first.
          # Repositories that only have main/master can merge directly there.
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            if [[ "$TARGET" == "master" || "$TARGET" == "main" ]]; then
              if [[ "$SOURCE" == "dev" ]]; then
                echo "Release promotion PR (dev → $TARGET) — allowed."
                exit 0
              fi
              echo "::error::Direct PRs to $TARGET are not allowed while a dev branch exists."
              echo "::error::Please target 'dev' instead. Only 'dev → master/main' PRs are permitted."
              exit 1
            fi
          fi

          echo "PR targets '$TARGET' — OK."
