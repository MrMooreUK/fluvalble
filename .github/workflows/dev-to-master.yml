name: Dev → Master promotion check

# Extra validation that only runs when dev is being merged into master/main.
# Checks that the manifest version is a clean semver and that the detailed
# changelog and curated user-facing release notes are ready before merging.

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  promotion-checks:
    name: Promotion readiness
    runs-on: ubuntu-latest
    if: github.head_ref == 'dev'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate manifest version is semver
        run: |
          python - <<'EOF'
          import json, re, sys
          manifest = json.load(open("custom_components/fluvalble/manifest.json"))
          version = manifest.get("version", "")
          if not re.match(r"^\d+\.\d+\.\d+$", version):
              print(f"::error::manifest.json version '{version}' is not valid semver (X.Y.Z)", file=sys.stderr)
              sys.exit(1)
          print(f"Version OK: {version}")
          EOF

      - name: Check CHANGELOG has entry for this version
        run: |
          python - <<'EOF'
          import json, sys
          version = json.load(open("custom_components/fluvalble/manifest.json"))["version"]
          changelog = open("CHANGELOG.md").read()
          if f"[{version}]" not in changelog:
              print(f"::error::No CHANGELOG.md entry found for version {version}", file=sys.stderr)
              print("::error::Add a section '## [{version}] — YYYY-MM-DD' before merging.", file=sys.stderr)
              sys.exit(1)
          print(f"CHANGELOG entry found for {version}")
          EOF

      - name: Check curated release notes for this version
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          version = json.load(open("custom_components/fluvalble/manifest.json"))["version"]
          notes_path = Path("docs/releases") / f"v{version}.md"
          if not notes_path.is_file():
              print(f"::error::No curated release notes found at {notes_path}", file=sys.stderr)
              sys.exit(1)
          expected_heading = f"# Fluval BLE v{version}"
          if not notes_path.read_text(encoding="utf-8").startswith(expected_heading):
              print(f"::error::{notes_path} must start with '{expected_heading}'", file=sys.stderr)
              sys.exit(1)
          print(f"Curated release notes found for {version}: {notes_path}")
          EOF

      - name: Run full test suite one more time
        run: |
          pip install -r requirements.txt --quiet
          python -m pytest tests/ -v --tb=short
