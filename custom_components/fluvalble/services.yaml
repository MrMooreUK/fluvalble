set_channels:
  name: Set color channels
  description: Set one or more Fluval light color channels, optionally ramping over time.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    red:
      name: Red
      description: Red channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    green:
      name: Green
      description: Green channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    blue:
      name: Blue
      description: Blue channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    white:
      name: White
      description: White channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    channel_5:
      name: Violet
      description: Violet channel intensity for compatible fixtures, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    transition:
      name: Transition
      description: Ramp duration in seconds.
      default: 0
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
    step_seconds:
      name: Step seconds
      description: Seconds between writes during a ramp.
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s

preview_schedule:
  name: Preview schedule
  description: Preview an editor-owned channel curve with ordinary channel writes. This does not use fixture-native preview.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    points:
      name: Schedule points
      description: List of points with time plus red, green, blue, white, and optional channel_5 values.
      required: true
      example:
        - time: "10:00"
          red: 0
          green: 0
          blue: 0
          white: 0
        - time: "11:00"
          red: 10
          green: 10
          blue: 25
          white: 5
      selector:
        object:
    duration:
      name: Preview duration
      description: Number of seconds to compress the 24-hour preview into.
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    step_seconds:
      name: Step seconds
      description: Seconds between preview writes.
      default: 2
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s

preview_native_schedule:
  name: Preview native schedule time
  description: Preview one minute of an Auto or Professional schedule already stored on the fixture, using the APK-native preview command.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    minute:
      name: Minute of day
      description: Fixture schedule minute to preview, from midnight (0) through 23:59 (1439).
      required: true
      selector:
        number:
          min: 0
          max: 1439
          mode: slider
    schedule_type:
      name: Schedule type
      description: Select the stored Auto or Professional schedule.
      required: true
      selector:
        select:
          options:
            - auto
            - professional

stop_preview:
  name: Stop preview
  description: Stop an editor-owned or fixture-native schedule preview and restore the prior fixture mode.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:

save_schedule:
  name: Save schedule
  description: Save a Fluval 24-hour curve and optionally upload it to the fixture's native scheduler.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    points:
      name: Schedule points
      description: List of schedule points with time plus red, green, blue, white, and optional channel_5 values.
      required: true
      example:
        - time: "10:00"
          red: 0
          green: 0
          blue: 0
          white: 0
        - time: "11:00"
          red: 10
          green: 10
          blue: 25
          white: 5
      selector:
        object:
    mode:
      name: Schedule mode
      description: Manual saves the curve and disables the onboard scheduler. Native uploads an APK-supported curve (4-10 classic/OLD; 4-12 FACEBD/MESH) and lets the fixture run its own clock.
      selector:
        select:
          options:
            - manual
            - native

set_native_auto_schedule:
  name: Set native Auto schedule
  description: Write the controller's native Auto sunrise/sunset schedule using the classic, FACEBD, or FFF0/SPP protocol.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    schedule:
      name: Auto schedule
      description: Sunrise, sunset, optional sleep time, ramp minutes, and five-channel day/night levels.
      required: true
      example:
        sunrise: "08:00"
        sunrise_ramp: 60
        sunset: "20:00"
        sunset_ramp: 60
        sleep: "23:00"
        day:
          red: 80
          blue: 70
          cool_white: 60
          warm_white: 50
          amber: 40
        night:
          red: 0
          blue: 5
          cool_white: 0
          warm_white: 0
          amber: 0
      selector:
        object:

set_native_pro_schedule:
  name: Set native Professional schedule
  description: Write native Professional schedule points using the classic, FACEBD, or FFF0/SPP protocol.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    points:
      name: Schedule points
      description: Four to 10 points for classic/OLD or four to 12 for FACEBD/SPP, in the fixture's APK-defined channel order.
      required: true
      example:
        - time: "08:00"
          red: 0
          blue: 0
          cool_white: 0
          warm_white: 0
          amber: 0
        - time: "12:00"
          red: 80
          blue: 70
          cool_white: 60
          warm_white: 50
          amber: 40
        - time: "20:00"
          red: 20
          blue: 20
          cool_white: 10
          warm_white: 10
          amber: 5
        - time: "22:00"
          red: 0
          blue: 0
          cool_white: 0
          warm_white: 0
          amber: 0
      selector:
        object:

set_native_effect_schedule:
  name: Set native effect schedule
  description: Store up to seven timed native-effect windows directly in a supported classic, FACEBD, or FFF0/SPP fixture. The exact APK product ID selects the 11-effect catalogue or four-effect subset. An empty list clears all windows.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    windows:
      name: Effect windows
      description: Windows with start/end, effect, optional weekdays, and optional enabled state. Each weekday can be assigned to only one window, matching FluvalConnect.
      required: true
      example:
        - start: "12:00"
          end: "12:10"
          effect: Thunderstorm
          weekdays:
            - monday
            - wednesday
            - friday
          enabled: true
      selector:
        object:
