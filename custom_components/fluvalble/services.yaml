set_channels:
  name: Set physical channels
  description: Set one or more APK-defined Fluval emitter channels, optionally ramping over time. Channel names differ by fixture; the device's Number entities show the exact labels.
  fields:
    device_id:
      name: Light
      description: Fluval light to control.
      required: true
      selector:
        device:
          integration: fluvalble
    channel_1:
      name: Channel 1
      description: First physical emitter channel for this fixture, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    channel_2:
      name: Channel 2
      description: Second physical emitter channel for this fixture, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    channel_3:
      name: Channel 3
      description: Third physical emitter channel for this fixture, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    channel_4:
      name: Channel 4
      description: Fourth physical emitter channel for this fixture, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    channel_5:
      name: Channel 5
      description: Fifth physical emitter channel for compatible fixtures, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    transition:
      name: Transition
      description: Ramp duration in seconds.
      default: 0
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
    step_seconds:
      name: Step seconds
      description: Seconds between writes during a ramp.
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s

recall_manual_preset:
  name: Recall manual preset
  description: Apply one fixture-resident P1-P4 preset on a supported first-generation Fluval light. The light must be on and its presets must have been read successfully.
  fields:
    device_id:
      name: Light
      description: Fluval light whose preset should be recalled.
      required: true
      selector:
        device:
          integration: fluvalble
    slot:
      name: Preset slot
      description: Fixture-resident manual preset P1 through P4.
      required: true
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box

save_manual_preset:
  name: Save manual preset
  description: Save the current channel levels in fixture slot P1-P4 on a supported first-generation Fluval light.
  fields:
    device_id:
      name: Light
      description: Fluval light whose current levels should be saved.
      required: true
      selector:
        device:
          integration: fluvalble
    slot:
      name: Preset slot
      description: Fixture-resident manual preset P1 through P4.
      required: true
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box
