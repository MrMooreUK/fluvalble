set_channels:
  name: Set color channels
  description: Set one or more Fluval light color channels, optionally ramping over time.
  fields:
    device_id:
      name: Light
      description: Fluval light to control.
      required: true
      selector:
        device:
          integration: fluvalble
    red:
      name: Red
      description: Red channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    green:
      name: Green
      description: Green channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    blue:
      name: Blue
      description: Blue channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    white:
      name: White
      description: White channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    channel_5:
      name: Violet
      description: Violet channel intensity for compatible fixtures, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    transition:
      name: Transition
      description: Ramp duration in seconds.
      default: 0
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
    step_seconds:
      name: Step seconds
      description: Seconds between writes during a ramp.
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s

recall_manual_preset:
  name: Recall manual preset
  description: Apply one fixture-resident P1-P4 preset on a supported first-generation Fluval light. The light must be on and its presets must have been read successfully.
  fields:
    device_id:
      name: Light
      description: Fluval light whose preset should be recalled.
      required: true
      selector:
        device:
          integration: fluvalble
    slot:
      name: Preset slot
      description: Fixture-resident manual preset P1 through P4.
      required: true
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box

save_manual_preset:
  name: Save manual preset
  description: Save the current channel levels in fixture slot P1-P4 on a supported first-generation Fluval light.
  fields:
    device_id:
      name: Light
      description: Fluval light whose current levels should be saved.
      required: true
      selector:
        device:
          integration: fluvalble
    slot:
      name: Preset slot
      description: Fixture-resident manual preset P1 through P4.
      required: true
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box

preview_schedule:
  name: Preview schedule
  description: Preview an editor-owned channel curve with ordinary channel writes. This does not use fixture-native preview.
  fields:
    device_id:
      name: Light
      description: Fluval light on which to preview the schedule.
      required: true
      selector:
        device:
          integration: fluvalble
    points:
      name: Schedule points
      description: List of points with time plus channel_1 through channel_5 values in the fixture's APK-defined order. Previous RGB-style names remain accepted as aliases.
      required: true
      example:
        - time: "10:00"
          channel_1: 0
          channel_2: 0
          channel_3: 0
          channel_4: 0
          channel_5: 0
        - time: "11:00"
          channel_1: 10
          channel_2: 10
          channel_3: 25
          channel_4: 5
          channel_5: 0
      selector:
        object:
    duration:
      name: Preview duration
      description: Number of seconds to compress the 24-hour preview into.
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    step_seconds:
      name: Step seconds
      description: Seconds between preview writes.
      default: 2
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s

preview_native_schedule:
  name: Preview native schedule time
  description: Preview one minute of an Auto or Professional schedule already stored on the light.
  fields:
    device_id:
      name: Light
      description: Fluval light on which to preview the stored schedule.
      required: true
      selector:
        device:
          integration: fluvalble
    minute:
      name: Minute of day
      description: Fixture schedule minute to preview, from midnight (0) through 23:59 (1439).
      required: true
      selector:
        number:
          min: 0
          max: 1439
          mode: slider
    schedule_type:
      name: Schedule type
      description: Select the stored Auto or Professional schedule.
      required: true
      selector:
        select:
          options:
            - auto
            - professional

stop_preview:
  name: Stop preview
  description: Stop an editor-owned or fixture-native schedule preview and restore the prior fixture mode.
  fields:
    device_id:
      name: Light
      description: Fluval light whose schedule preview should stop.
      required: true
      selector:
        device:
          integration: fluvalble

save_schedule:
  name: Save schedule
  description: Save a Fluval 24-hour curve and optionally upload it to the fixture's native scheduler.
  fields:
    device_id:
      name: Light
      description: Fluval light whose schedule should be saved.
      required: true
      selector:
        device:
          integration: fluvalble
    points:
      name: Schedule points
      description: List of schedule points with time plus channel_1 through channel_5 values in the fixture's APK-defined order. Previous RGB-style names remain accepted as aliases.
      required: true
      example:
        - time: "10:00"
          channel_1: 0
          channel_2: 0
          channel_3: 0
          channel_4: 0
          channel_5: 0
        - time: "11:00"
          channel_1: 10
          channel_2: 10
          channel_3: 25
          channel_4: 5
          channel_5: 0
      selector:
        object:
    mode:
      name: Schedule mode
      description: Manual saves the curve and disables the onboard scheduler. Native uploads a curve within the detected light's supported point limit and lets the fixture run its own clock.
      selector:
        select:
          options:
            - manual
            - native

set_native_auto_schedule:
  name: Set native Auto schedule
  description: Write an Auto sunrise and sunset schedule to the detected light's onboard scheduler.
  fields:
    device_id:
      name: Light
      description: Fluval light whose Auto schedule should be set.
      required: true
      selector:
        device:
          integration: fluvalble
    schedule:
      name: Auto schedule
      description: Sunrise, sunset, optional sleep time, ramp minutes, and channel_1 through channel_5 day/night levels in the fixture's APK-defined order. Previous Plant-specific names remain accepted as aliases.
      required: true
      example:
        sunrise: "08:00"
        sunrise_ramp: 60
        sunset: "20:00"
        sunset_ramp: 60
        sleep: "23:00"
        day:
          channel_1: 80
          channel_2: 70
          channel_3: 60
          channel_4: 50
          channel_5: 40
        night:
          channel_1: 0
          channel_2: 5
          channel_3: 0
          channel_4: 0
          channel_5: 0
      selector:
        object:

set_native_pro_schedule:
  name: Set native Professional schedule
  description: Write timed channel points to the detected light's onboard Professional schedule. Previous Plant-specific channel names remain accepted as aliases.
  fields:
    device_id:
      name: Light
      description: Fluval light whose Professional schedule should be set.
      required: true
      selector:
        device:
          integration: fluvalble
    points:
      name: Schedule points
      description: Four to 12 timed points in the detected light's channel order. The integration enforces the model's supported limit.
      required: true
      example:
        - time: "08:00"
          channel_1: 0
          channel_2: 0
          channel_3: 0
          channel_4: 0
          channel_5: 0
        - time: "12:00"
          channel_1: 80
          channel_2: 70
          channel_3: 60
          channel_4: 50
          channel_5: 40
        - time: "20:00"
          channel_1: 20
          channel_2: 20
          channel_3: 10
          channel_4: 10
          channel_5: 5
        - time: "22:00"
          channel_1: 0
          channel_2: 0
          channel_3: 0
          channel_4: 0
          channel_5: 0
      selector:
        object:

set_native_effect_schedule:
  name: Set native effect schedule
  description: Store up to seven timed native-effect windows on a supported Fluval light. The detected model selects the available effects. An empty list clears all windows.
  fields:
    device_id:
      name: Light
      description: Fluval light whose timed effects should be set.
      required: true
      selector:
        device:
          integration: fluvalble
    windows:
      name: Effect windows
      description: Windows with start/end, effect, optional weekdays, and optional enabled state. Each weekday can be assigned to only one window, matching FluvalConnect.
      required: true
      example:
        - start: "12:00"
          end: "12:10"
          effect: Thunderstorm
          weekdays:
            - monday
            - wednesday
            - friday
          enabled: true
      selector:
        object:
