set_channels:
  name: Set color channels
  description: Set one or more Fluval light color channels, optionally ramping over time.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    red:
      name: Red
      description: Red channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    green:
      name: Green
      description: Green channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    blue:
      name: Blue
      description: Blue channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    white:
      name: White
      description: White channel intensity, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    channel_5:
      name: Violet
      description: Violet channel intensity for compatible fixtures, 0-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    transition:
      name: Transition
      description: Ramp duration in seconds.
      default: 0
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
    step_seconds:
      name: Step seconds
      description: Seconds between writes during a ramp.
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s

preview_schedule:
  name: Preview schedule
  description: Physically preview a 24-hour Fluval channel schedule compressed into a short duration.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    points:
      name: Schedule points
      description: List of points with time plus red, green, blue, white, and optional channel_5 values.
      required: true
      example:
        - time: "10:00"
          red: 0
          green: 0
          blue: 0
          white: 0
        - time: "11:00"
          red: 10
          green: 10
          blue: 25
          white: 5
      selector:
        object:
    duration:
      name: Preview duration
      description: Number of seconds to compress the 24-hour preview into.
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    step_seconds:
      name: Step seconds
      description: Seconds between preview writes.
      default: 2
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s

stop_preview:
  name: Stop preview
  description: Stop a running physical schedule preview.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:

save_schedule:
  name: Save schedule
  description: Save a Fluval 24-hour curve and optionally upload it to the fixture's native scheduler.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    points:
      name: Schedule points
      description: List of schedule points with time plus red, green, blue, white, and optional channel_5 values.
      required: true
      example:
        - time: "10:00"
          red: 0
          green: 0
          blue: 0
          white: 0
        - time: "11:00"
          red: 10
          green: 10
          blue: 25
          white: 5
      selector:
        object:
    mode:
      name: Schedule mode
      description: Manual saves the curve and disables the onboard scheduler. Native uploads 2-12 points once and lets the fixture run its own clock.
      selector:
        select:
          options:
            - manual
            - native

set_native_auto_schedule:
  name: Set native Auto schedule
  description: Write the controller's native Auto sunrise/sunset schedule using the classic, FACEBD, or Plant Pro protocol.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    schedule:
      name: Auto schedule
      description: Sunrise, sunset, optional sleep time, ramp minutes, and five-channel day/night levels.
      required: true
      example:
        sunrise: "08:00"
        sunrise_ramp: 60
        sunset: "20:00"
        sunset_ramp: 60
        sleep: "23:00"
        day:
          red: 80
          blue: 70
          cool_white: 60
          warm_white: 50
          amber: 40
        night:
          red: 0
          blue: 5
          cool_white: 0
          warm_white: 0
          amber: 0
      selector:
        object:

set_native_pro_schedule:
  name: Set native Professional schedule
  description: Write native Professional schedule points using the classic, FACEBD, or Plant Pro protocol.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    points:
      name: Schedule points
      description: Two to 12 points with time plus channel_1 through channel_5. AquaSky ignores channel_5; Plant Pro order is Red, Blue, Cool White, Warm White, Amber.
      required: true
      example:
        - time: "08:00"
          red: 0
          blue: 0
          cool_white: 0
          warm_white: 0
          amber: 0
        - time: "12:00"
          red: 80
          blue: 70
          cool_white: 60
          warm_white: 50
          amber: 40
      selector:
        object:

set_native_effect_schedule:
  name: Set Plant Pro effect schedule
  description: Store up to seven timed native-effect windows directly in a Plant Pro 4.0 fixture. An empty list clears all windows.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    windows:
      name: Effect windows
      description: Windows with start/end, effect, optional weekdays, and optional enabled state.
      required: true
      example:
        - start: "12:00"
          end: "12:10"
          effect: Thunderstorm
          weekdays:
            - monday
            - wednesday
            - friday
          enabled: true
      selector:
        object:
